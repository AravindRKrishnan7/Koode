<!doctype html>
<html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koode — allow site access</title>
<style>
  :root { color-scheme: light; --bg: #fdf6ec; --fg: #2a1c10; --muted: #7a6450; --card: #fffcf7; --line: #f0dcc2; --ok: #e8650f; --trust: #1f6f5c; --trust-soft: #e1f3ee; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #1b140d; --fg: #f6ead9; --muted: #c4ab8e; --card: #241a11; --line: #43311f; --ok: #f07a26; --trust: #6fd1b7; --trust-soft: #16302a; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 "Noto Sans Malayalam", "Nirmala UI", "Malayalam Sangam MN", system-ui, sans-serif; }
  .logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 700; background: linear-gradient(140deg, #f59a3c, #e8650f); margin-bottom: 12px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; color: var(--trust); background: var(--trust-soft); border-radius: 999px; padding: 2px 10px; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: 0 8px 24px rgba(90,50,10,.1); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .host { font-family: ui-monospace, monospace; font-weight: 600; }
  .muted { color: var(--muted); font-size: 14px; }
  .btns { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
</style></head>
<body><main><div class="card">
  <div class="logo" aria-hidden="true">കൂ</div>
  <span class="badge">🛡️ ഔദ്യോഗിക സൈറ്റ് · Official site</span>
  <h1>Koode: ഔദ്യോഗിക സൈറ്റ് തുറക്കാൻ അനുവാദം</h1>
  <p id="what">…</p>
  <p class="muted" id="why">Chrome will ask once whether Koode may work on this one site. Koode reads only the buttons and labels on the page, never what you type (passwords, OTPs, licence numbers).</p>
  <div class="btns"><button class="ok" id="allow" type="button" disabled>✓ അനുവദിച്ച് തുറക്കാം · Allow &amp; open</button><button id="cancel" type="button">✗ വേണ്ട · Cancel</button></div>
  <p class="muted" id="status"></p>
</div></main>
<script src="../shared/goals.js"></script>
<script src="../shared/catalogue.js"></script>
<script src="grant.js"></script>
</body></html>
