<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Home</title>
<!-- TEST FIXTURE served by tests/e2e/journey.mjs at https://sarathi.parivahan.gov.in/ via request interception.
     Not the real Sarathi portal: a structural stand-in built from read-only inspection of the live site on
     2026-11-22 (an "Update Your Mobile Number" popup over the state list, seen on some live loads → state list → "Contactless Licence Services" popup with Skip → menus → Others → DL Search →
     Mobile Number + Captcha → Generate OTP). Full page loads between pages, like the real site. -->
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #e0f2fe; }
  #fixture { background: #fde68a; padding: 4px 8px; font-size: 12px; }
  header { background: #1d9bf0; color: #fff; padding: 10px 16px; display: flex; gap: 16px; align-items: center; }
  nav { background: #1e88e5; display: flex; gap: 4px; padding: 0 16px; }
  nav .dd { position: relative; }
  nav .dd > a { display: block; color: #fff; padding: 10px 12px; text-decoration: none; }
  nav .menu { display: none; position: absolute; top: 100%; left: 0; background: #fff; min-width: 260px; box-shadow: 0 4px 12px #0003; z-index: 5; }
  nav .menu a { display: block; padding: 8px 12px; color: #0f172a; text-decoration: none; }
  nav .dd.open .menu { display: block; }
  main { padding: 24px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .tiles a { background: #fff; padding: 16px; border-radius: 8px; text-align: center; color: #0f172a; text-decoration: none; }
  #modal { position: fixed; inset: 0; background: #0006; display: flex; align-items: flex-start; justify-content: center; padding-top: 40px; z-index: 10; }
  #modal .box { background: #fff; width: 800px; border-radius: 6px; padding: 16px; }
  #modal .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  #modal .grid button { background: #0033cc; color: #fff; border: 0; padding: 8px; text-align: left; }
  .form { background: #fff; max-width: 820px; margin: 0 auto; border: 1px solid #38bdf8; }
  .form .row { display: flex; gap: 16px; align-items: center; justify-content: center; padding: 8px; }
  .form .btns { display: flex; gap: 16px; justify-content: center; padding: 12px; }
  [hidden] { display: none !important; }
  .cap { font: italic 700 20px monospace; background: #ddd; color: #16a34a; padding: 2px 8px; }
</style></head>
<body>
<div id="fixture">Koode test fixture — not the real Sarathi portal</div>
<header><b>MINISTRY OF ROAD TRANSPORT &amp; HIGHWAYS · Government of India</b><b>Sarathi PARIVAHAN</b><a id="login" href="sarathilogin.do" style="color:#fff">Login</a></header>
<div id="view"></div>
<script>
  const STATES = { AN: 'Andaman and Nicobar', AP: 'Andhra Pradesh', AS: 'Assam', BR: 'Bihar', DL: 'Delhi', GA: 'Goa', GJ: 'Gujarat', KA: 'Karnataka', KL: 'Kerala', MH: 'Maharashtra', TN: 'Tamil Nadu', TG: 'Telangana', UP: 'Uttar Pradesh', WB: 'West Bengal' };
  const view = document.getElementById('view');
  const p = location.pathname;
  const menu = (name, links) => `<div class="dd"><a href="#" class="nav-link dropdown-toggle">${name}</a><div class="menu">${links.map(([t, h]) => `<a href="${h}">${t}</a>`).join('')}</div></div>`;
  if (/stateSelection\.do$/.test(p) || p === '/' || p === '/sarathiservice/') {
    document.title = 'Home';
    view.innerHTML = `<main><h4>Please select the State from where the service is required</h4>
      <form id="stateSelectBean" name="stSelForm" action="stateSelectBean.do" method="post">
        <select name="stName" id="stfNameId" onchange="this.form.submit();"><option value="0">---Select State Name---</option>
        ${Object.entries(STATES).map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select></form>
      <h5>Beware of Fraudulent Websites and Apps</h5></main>
      <div id="mobmodal" style="position:fixed;inset:0;background:#0006;z-index:20;display:flex;justify-content:center;align-items:flex-start;padding-top:30px">
        <div style="background:#fff;width:900px;padding:16px;border-radius:6px"><h4 id="headerupdatemobileno" style="display:inline">Update Your Mobile Number</h4>
        <button type="button" class="close" style="float:right" onclick="document.getElementById('mobmodal').remove()">×</button>
        <p>Driving license holders and registered vehicle owners are advised to ensure their mobile numbers are updated in the Vahan and Sarathi portals.</p>
        <a href="https://vahan.parivahan.gov.in/mobileupdate/">https://vahan.parivahan.gov.in/mobileupdate/</a> · <a href="mobNumUpdpub.do">https://sarathi.parivahan.gov.in/sarathiservice/mobNumUpdpub.do</a></div></div>`;
  } else if (/stateSelectBean\.do$/.test(p)) {
    document.title = 'Home';
    view.innerHTML = `<nav>${menu('Learner Licence', [['Application for New Learner Licence', 'newLLDet.do'], ['Print Learner Licence (Form3)', 'printlearerslicenceinstruction.do']])}
      ${menu('Driving Licence', [['New Driving Licence', 'newDLDet.do'], ['Services on DL (Renewal/Duplicate/AEDL/IDP/Others)', 'dlServicesDet.do'], ['Print Driving Licence', 'dlreportaction.do']])}
      ${menu('Appointments', [['LL Test Slot Booking', 'llslotbook.do']])}
      ${menu('Others', [['DL Search', 'dlSearch.do'], ['Find Application Number', 'applnoSearch.do'], ['Application Status', 'applViewStatus.do']])}</nav>
      <main><h3>TRANSPORT DEPARTMENT, GOVERNMENT OF KERALA</h3><div class="tiles"><a href="newLLDet.do">Apply for Learner Licence</a><a href="newDLDet.do">Apply for Driving Licence</a><a href="dlServicesDet.do">Apply for DL Renewal</a><a href="dlServicesDet.do">DL Extract</a></div></main>
      <div id="modal"><div class="box"><h3>Contactless Licence Services</h3><p>The following services are Faceless services.</p>
        <div class="grid"><button>ISSUE OF LEARNERS LICENCE</button><button>ISSUE OF DUPLICATE DL</button><button>RENEWAL OF DL</button><button>DL EXTRACT</button></div>
        <input type="button" value="Skip" onclick="document.getElementById('modal').remove()"> <button type="button" onclick="document.getElementById('modal').remove()">x</button></div></div>`;
    document.querySelectorAll('nav .dropdown-toggle').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); document.querySelectorAll('nav .dd').forEach((d) => d !== a.parentElement && d.classList.remove('open')); a.parentElement.classList.toggle('open'); }));
  } else if (/dlSearch\.do$/.test(p)) {
    document.title = 'Non-eKYC Form';
    view.innerHTML = `<main><h3 style="text-align:center">TRANSPORT DEPARTMENT, GOVERNMENT OF KERALA</h3><div class="form"><div style="background:#38bdf8;color:#fff;padding:6px 12px">Sarathi Mobile Authentication · DRIVING LICENSE SEARCH</div>
      <form id="nonekycForm" onsubmit="return false">
        <div class="row"><span>* Mobile Number :</span><input type="text" id="mobileNumber" name="mobileNumber" placeholder="Enter Mobile Number Here" maxlength="10" pattern="[6-9][0-9]{9}"></div>
        <div class="row"><span>* Captcha :</span><input type="text" id="entcaptxt" name="entcaptxt" placeholder="Enter Captcha Here"><img id="capimg" alt="Captcha" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="><span class="cap">7aFvDu</span></div>
        <div class="btns"><button type="submit" id="generateSarathiotp">Generate OTP</button><input type="button" id="resetDl" value="Reset"><input type="button" value="Cancel" onclick="location.href='stateSelection.do'"></div>
        <div id="otpbox" hidden class="row"><b>OTP sent to the registered mobile number (fixture).</b><input type="text" id="otp" placeholder="Enter OTP"><button type="button">Submit</button></div>
      </form></div></main>`;
    document.getElementById('generateSarathiotp').addEventListener('click', () => { document.getElementById('otpbox').hidden = false; });
  } else {
    view.innerHTML = `<main><h3>${p.split('/').pop()} (fixture page)</h3><a href="stateSelection.do">Change State</a></main>`;
  }
</script>
</body></html>
