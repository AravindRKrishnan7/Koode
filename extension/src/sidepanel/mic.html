<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koode microphone</title>
<style>
  :root { --ink: #1f2340; --muted: #59607f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fffdf9; color: var(--ink);
    font-family: "Noto Sans Malayalam","Noto Sans",system-ui,sans-serif; }
  .card { max-width: 440px; margin: 16px; padding: 24px; border-radius: 18px; background: #fff; box-shadow: 0 12px 32px rgba(31,35,64,.15); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; } p { line-height: 1.6; margin: 6px 0; } .en { color: var(--muted); font-size: 14px; }
  button { margin-top: 14px; border: none; border-radius: 12px; padding: 12px 18px; font: 700 15px inherit; color: #fff; background: #ff6a00; cursor: pointer; }
  .ok { color: #067647; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <h1>Koode — മൈക്രോഫോൺ</h1>
    <p id="ml">മലയാളത്തിൽ സംസാരിക്കാൻ Koode-ന് മൈക്ക് അനുവാദം വേണം. താഴെ അമർത്തി Chrome ചോദിക്കുമ്പോൾ "Allow" തിരഞ്ഞെടുക്കൂ.</p>
    <p class="en" id="en">To listen to you, Koode needs microphone access. Press the button and choose “Allow” when Chrome asks. Koode records only while you hold the mic button.</p>
    <button id="go" type="button">🎤 മൈക്ക് അനുവദിക്കുക · Allow microphone</button>
  </div>
  <script src="mic.js"></script>
</body>
</html>
