<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<title>Koode — കൂടെ</title>
<style>
  body { margin: 0; font-family: "Noto Sans Malayalam","Noto Sans",system-ui,sans-serif; color: #1f2340; background: #fffdf9; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: linear-gradient(135deg,#1f2340,#38407a); color: #fff; }
  header b { font-size: 16px; } header .pill { margin-left: auto; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.18); }
  main { padding: 12px 14px; }
  .where { font-size: 12px; color: #59607f; margin-bottom: 8px; }
  .ml { font-size: 16px; font-weight: 600; line-height: 1.5; } .en { font-size: 13px; color: #59607f; margin-top: 4px; }
  .notice { font-size: 12px; background: #fef0c7; color: #7a4b16; border-radius: 8px; padding: 6px 9px; margin-top: 8px; }
  form { display: flex; gap: 6px; margin-top: 12px; }
  input { flex: 1; min-width: 0; border: 1.5px solid #e2d6c8; border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 14px; }
  button { border-radius: 10px; font: 700 13px inherit; cursor: pointer; }
  .go { border: none; background: #ff6a00; color: #fff; padding: 0 14px; }
  .row { display: flex; gap: 6px; margin-top: 8px; } .row button { flex: 1; border: 1px solid #e2d6c8; background: #fff; padding: 7px; }
  .sites { margin-top: 14px; font-size: 12px; color: #59607f; } .sites button { margin: 4px 4px 0 0; border: 1px solid #c7d2fe; background: #eef2ff; padding: 5px 9px; font-weight: 600; }
  ol { font-size: 11px; color: #59607f; padding-left: 18px; max-height: 160px; overflow: auto; }
  .hidden { display: none; }
</style>
</head>
<body>
  <header><b>Koode</b><span>കൂടെ</span><span class="pill" id="pill">Ready</span></header>
  <main>
    <div class="where" id="where">–</div>
    <div class="ml" id="ml">എന്താണ് ചെയ്യേണ്ടത്? ഏത് വെബ്സൈറ്റ് തുറക്കണം എന്ന് പറയൂ.</div>
    <div class="en" id="en">What would you like to do? e.g. “Open WhatsApp Web” or “Open YouTube and find a Google Forms tutorial”.</div>
    <div class="notice hidden" id="notice"></div>
    <form id="f"><input id="goal" placeholder="e.g. Open YouTube" aria-label="Your request"><button class="go" type="submit">Go</button></form>
    <div class="row"><button id="end" type="button">End session</button></div>
    <div class="sites">Supported websites: <span id="sitelist"></span></div>
    <details><summary style="font-size:11px">Session log</summary><ol id="log"></ol></details>
  </main>
  <script src="../shared/sites.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
